name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        dependencies: ['minimum', 'latest']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install 'fastmcp==3.2.3' 'mcp==1.26.0'
      - run: python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))"
      - run: python -m pytest -q
  nix:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Generate lockfile in trusted CI (not in runtime updater)
        run: nix flake lock
      - name: Preserve authentic generated lockfile for review and commit
        if: always() && hashFiles('flake.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluated-flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 7
      - name: Actual updater Nix flags and Tcl output contract (local flake only)
        run: PYTHONPATH=src python3 nix/check_bundle_contract.py
      - run: nix flake check --no-build
      - run: nix build .#checks.x86_64-linux.module-eval .#default --print-build-logs
      - name: Isolated broker and file-permission VM (no IRC or credentials)
        run: nix build .#checks.x86_64-linux.control-vm --print-build-logs
# Only isolated synthetic VM services start; no live service changes,
# credential provisioning, IRC networking, or deployment in CI.
